<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Linux Quiz</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    body{
      background:#f2f4f8;
      display:flex;
      justify-content:center;
      align-items:center;
      min-height:100vh;
      padding:20px;
    }

    .container{
      width:100%;
      max-width:900px;
      background:white;
      border-radius:20px;
      padding:40px;
      box-shadow:0 10px 30px rgba(0,0,0,0.1);
    }

    h1{
      text-align:center;
      color:#005bbb;
      margin-bottom:40px;
      font-size:42px;
    }

    .modes{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
      gap:20px;
    }

    .card{
      background:#0066d9;
      color:white;
      padding:25px;
      border-radius:15px;
      cursor:pointer;
      transition:0.2s;
    }

    .card:hover{
      transform:translateY(-5px);
      background:#0052ad;
    }

    .card h2{
      margin-bottom:15px;
      font-size:28px;
    }

    .card p{
      line-height:1.5;
      opacity:0.95;
    }

    .quiz{
      display:none;
    }

    .question{
      font-size:28px;
      margin-bottom:25px;
      color:#222;
    }

    .answers{
      display:flex;
      flex-direction:column;
      gap:15px;
    }

    .answers button{
      padding:18px;
      border:none;
      border-radius:12px;
      background:#edf2ff;
      cursor:pointer;
      font-size:18px;
      transition:0.2s;
    }

    .answers button:hover{
      background:#dbe7ff;
    }

    .correct{
      background:#5fd38d !important;
      color:white;
    }

    .wrong{
      background:#ff6b6b !important;
      color:white;
    }

    .next-btn{
      margin-top:25px;
      padding:15px 25px;
      border:none;
      border-radius:10px;
      background:#0066d9;
      color:white;
      font-size:18px;
      cursor:pointer;
      display:none;
    }

    .score{
      text-align:center;
      font-size:32px;
      margin-top:30px;
      color:#0066d9;
    }

    .topbar{
      display:flex;
      justify-content:space-between;
      margin-bottom:20px;
      font-size:20px;
      color:#444;
    }
  </style>
</head>
<body>

<div class="container">

  <div id="menu">
    <h1>Linux Fundamentals Quiz</h1>

    <div class="modes">
      <div class="card" onclick="startQuiz()">
        <h2>Учебный режим</h2>
        <p>
          Мгновенная проверка ответов и обучение.
        </p>
      </div>

      <div class="card" onclick="startQuiz()">
        <h2>Экзамен</h2>
        <p>
          Результат только после окончания теста.
        </p>
      </div>

      <div class="card" onclick="startQuiz()">
        <h2>Быстрый тест</h2>
        <p>
          Случайные вопросы для тренировки.
        </p>
      </div>

      <div class="card" onclick="startQuiz()">
        <h2>По темам</h2>
        <p>
          Linux команды, Bash, процессы и права.
        </p>
      </div>
    </div>
  </div>

  <div class="quiz" id="quiz">

    <div class="topbar">
      <div id="counter">Вопрос 1</div>
      <div id="scoreLive">Очки: 0</div>
    </div>

    <div class="question" id="question">
      Вопрос
    </div>

    <div class="answers" id="answers"></div>

    <button class="next-btn" id="nextBtn" onclick="nextQuestion()">
      Следующий вопрос
    </button>

    <div class="score" id="finalScore"></div>

  </div>

</div>

<script>
let allQuestions = []; // Все вопросы из базы
let quizQuestions = []; // Вопросы для текущей сессии
let currentQuestion = 0;
let score = 0;
let isExamMode = false; // Флаг режима экзамена
let selectedAnswerIndex = null; // Храним выбранный ответ для режима экзамена

const menu = document.getElementById("menu");
const quiz = document.getElementById("quiz");
const questionEl = document.getElementById("question");
const answersEl = document.getElementById("answers");
const nextBtn = document.getElementById("nextBtn");
const finalScore = document.getElementById("finalScore");
const counter = document.getElementById("counter");
const scoreLive = document.getElementById("scoreLive");

// 1. Загружаем вопросы сразу при старте страницы
fetch("questions.json")
  .then(res => {
    if (!res.ok) throw new Error("Не удалось загрузить вопросы. Проверьте questions.json");
    return res.json();
  })
  .then(data => {
    allQuestions = data;
    console.log("Вопросы успешно загружены:", allQuestions.length);
  })
  .catch(err => {
    alert("Ошибка конфигурации: убедитесь, что файл questions.json лежит в той же папке.");
    console.error(err);
  });

// 2. Запуск квиза с учетом выбранного режима
function startQuiz(mode, topic = null) {
  if (allQuestions.length === 0) {
    alert("Вопросы еще загружаются, подождите секунду...");
    return;
  }

  // Сброс настроек
  currentQuestion = 0;
  score = 0;
  isExamMode = false;
  selectedAnswerIndex = null;
  
  // Возвращаем видимость элементам после предыдущих игр
  questionEl.style.display = "block";
  answersEl.style.display = "flex";
  finalScore.innerHTML = "";
  scoreLive.style.display = "block";

  // Логика режимов
  if (mode === 'study') {
    quizQuestions = [...allQuestions];
  } 
  else if (mode === 'exam') {
    isExamMode = true;
    quizQuestions = [...allQuestions];
    scoreLive.style.display = "none"; // На экзамене не спойлерим очки
  } 
  else if (mode === 'quick') {
    // Перемешиваем и берем, например, 5 случайных вопросов
    quizQuestions = [...allQuestions].sort(() => 0.5 - Math.random()).slice(0, 5);
  } 
  else if (mode === 'topic') {
    // Фильтруем по теме (в questions.json должно быть поле "topic")
    quizQuestions = allQuestions.filter(q => q.topic === topic);
    if (quizQuestions.length === 0) {
      alert(`Вопросов по теме "${topic}" не найдено. Запускаем общую базу.`);
      quizQuestions = [...allQuestions];
    }
  }

  menu.style.display = "none";
  quiz.style.display = "block";
  showQuestion();
}

// 3. Отображение вопроса
function showQuestion() {
  nextBtn.style.display = "none";
  selectedAnswerIndex = null;

  const q = quizQuestions[currentQuestion];
  counter.innerText = `Вопрос ${currentQuestion + 1} / ${quizQuestions.length}`;
  scoreLive.innerText = `Очки: ${score}`;
  questionEl.innerText = q.question;
  answersEl.innerHTML = "";

  q.answers.forEach((answer, index) => {
    const btn = document.createElement("button");
    btn.innerText = answer;
    btn.onclick = () => handleAnswerClick(index, btn);
    answersEl.appendChild(btn);
  });
}

// 4. Обработка клика
function handleAnswerClick(index, button) {
  const q = quizQuestions[currentQuestion];
  const buttons = answersEl.querySelectorAll("button");

  if (isExamMode) {
    // В режиме экзамена просто фиксируем выбор, не показывая правильный/неправильный
    buttons.forEach(btn => btn.style.background = "#edf2ff");
    button.style.background = "#dbe7ff"; // Подсвечиваем выбранный
    selectedAnswerIndex = index;
    nextBtn.innerText = "Ответить";
    nextBtn.style.display = "inline-block";
  } else {
    // В обычном режиме — мгновенная проверка
    buttons.forEach(btn => btn.disabled = true);
    if (index === q.correct) {
      button.classList.add("correct");
      score++;
    } else {
      button.classList.add("wrong");
      buttons[q.correct].classList.add("correct");
    }
    scoreLive.innerText = `Очки: ${score}`;
    nextBtn.innerText = "Следующий вопрос";
    nextBtn.style.display = "inline-block";
  }
}

// 5. Переход дальше
function nextQuestion() {
  const q = quizQuestions[currentQuestion];

  // Если это экзамен, считаем очки только при переходе
  if (isExamMode) {
    if (selectedAnswerIndex === q.correct) {
      score++;
    }
  }

  currentQuestion++;

  if (currentQuestion >= quizQuestions.length) {
    // Финал квиза
    questionEl.style.display = "none";
    answersEl.style.display = "none";
    nextBtn.style.display = "none";
    scoreLive.style.display = "none";

    finalScore.innerHTML = `
      <p>Ваш результат: <strong>${score} из ${quizQuestions.length}</strong></p>
      <button class="next-btn" style="display:inline-block; margin-top:20px;" onclick="goToMenu()">В меню</button>
    `;
    return;
  }

  showQuestion();
}

function goToMenu() {
  quiz.style.display = "none";
  menu.style.display = "block";
}
</script>

</body>
</html>
```
